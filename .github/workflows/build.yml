name: Build
on:
  push:
    branches:
      - phat-1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build bread-compact-wifi only
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build bread-compact-wifi
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          pip install rich_click
          python scripts/build.py bread-compact-wifi --name bread-compact-wifi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_bread-compact-wifi_pro_no_sleep
          path: build/**/merged-binary.bin
          retention-days: 7